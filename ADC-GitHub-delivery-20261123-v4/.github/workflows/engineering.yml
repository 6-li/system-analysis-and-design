name: Source build and unit checks
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  checks:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-node@v4
        with:
          node-version: '24.12.0'
      - name: Backend build and targeted no-database tests
        run: mvn -B -f backend/pom.xml '-Dtest=DoctorAppointmentLookupTest,CourseVisitDirectoryTest,CourseStaffLoginTest,QuarterExpenseCatalogTest,QuarterlyMultiClinicSourceTest,QuarterlyRecordsControllerTest,QuarterlyRecordsServiceTest,QuarterlyCalculationServiceTest,QuarterlyFinancialReviewServiceTest,QuarterlyPreviewServiceTest,CourseQuarterlyConfigurationTest' package
      - name: Staff dependencies, unit tests and build
        run: |
          npm --prefix apps/staff-web ci
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm --prefix apps/staff-web test
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm --prefix apps/staff-web run build
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Mini program logic checks
        run: node --test apps/patient-miniapp/tests/*.test.cjs
      - name: Update package safeguards
        run: |
          python tools/deploy/test_staff_experience.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python tools/deploy/test_quarterly_records.py
      - name: Test output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          if-no-files-found: ignore
          path: backend/target/surefire-reports/
